<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | World Currency Exchange</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <link rel="stylesheet" href="style.css">

    <script>
        (function() {
            document.documentElement.setAttribute('data-theme', 'light');
        })();
    </script>

</head>

<body class="auth-page">

    <div class="auth-theme-wrapper">
        <button
            id="themeToggle"
            class="theme-toggle auth-theme-toggle"
            title="Toggle Light / Dark Mode"
            aria-label="Toggle Light / Dark Mode"
            type="button"
        >
            <i class="fa-solid fa-moon"></i>
            <span class="theme-toggle-text">Dark Mode</span>
        </button>
    </div>

    <main class="auth-container">

        <section class="auth-info">

            <a href="login.html" class="brand">
                <span class="brand-icon">🌍</span>
                <span>World Currency Exchange</span>
            </a>

            <div class="auth-info-content">

                <span class="eyebrow">
                    JOIN THE PLATFORM
                </span>

                <h1>
                    Your global
                    <span>finance toolkit.</span>
                </h1>

                <p>
                    Create your account and access currency
                    conversion and exchange-rate tools.
                </p>

            </div>

        </section>


        <section class="auth-card">

            <div class="auth-title">

                <div class="auth-icon">
                    <i class="fa-solid fa-user-plus"></i>
                </div>

                <h2>Create Account</h2>

                <p>
                    Enter your details to get started.
                </p>

            </div>


            <form id="registerForm">

                <label>Full Name</label>

                <div class="input-box">

                    <i class="fa-regular fa-user"></i>

                    <input
                        type="text"
                        id="regName"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <label>Email Address</label>

                <div class="input-box">

                    <i class="fa-regular fa-envelope"></i>

                    <input
                        type="email"
                        id="regEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <label>Phone Number</label>

                <div class="input-box">

                    <i class="fa-solid fa-phone"></i>

                    <input
                        type="tel"
                        id="regPhone"
                        placeholder="+91 9876543210"
                        required
                    >

                </div>


                <label>Country</label>

                <div class="input-box">

                    <i class="fa-solid fa-globe"></i>

                    <select id="regCountry" required>

                        <option value="">
                            Select country
                        </option>

                        <option>India</option>
                        <option>United States</option>
                        <option>United Kingdom</option>
                        <option>United Arab Emirates</option>
                        <option>Australia</option>
                        <option>Canada</option>
                        <option>Japan</option>
                        <option>Singapore</option>
                        <option>Germany</option>

                    </select>

                </div>


                <div class="two-columns">

                    <div>

                        <label>Password</label>

                        <div class="input-box">

                            <i class="fa-solid fa-lock"></i>

                            <input
                                type="password"
                                id="regPassword"
                                placeholder="Password"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                data-target="regPassword"
                            >
                                <i class="fa-regular fa-eye"></i>
                            </button>

                        </div>

                    </div>


                    <div>

                        <label>Confirm Password</label>

                        <div class="input-box">

                            <i class="fa-solid fa-lock"></i>

                            <input
                                type="password"
                                id="regConfirm"
                                placeholder="Confirm"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                data-target="regConfirm"
                            >
                                <i class="fa-regular fa-eye"></i>
                            </button>

                        </div>

                    </div>

                </div>


                <label class="remember terms">

                    <input
                        type="checkbox"
                        id="regTerms"
                    >

                    <span>
                        I agree to the terms and conditions.
                    </span>

                </label>


                <button
                    type="submit"
                    class="primary-button full"
                >
                    CREATE ACCOUNT
                    <i class="fa-solid fa-user-plus"></i>
                </button>


                <p
                    id="registerMessage"
                    class="form-message"
                ></p>

            </form>


            <p class="auth-switch">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
