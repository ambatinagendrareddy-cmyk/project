<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Forgot Password | World Currency Exchange</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <link rel="stylesheet" href="style.css">

    <script>
        (function() {
            document.documentElement.setAttribute('data-theme', 'light');
        })();
    </script>

</head>

<body class="auth-page">

    <div class="auth-theme-wrapper">
        <button
            id="themeToggle"
            class="theme-toggle auth-theme-toggle"
            title="Toggle Light / Dark Mode"
            aria-label="Toggle Light / Dark Mode"
            type="button"
        >
            <i class="fa-solid fa-moon"></i>
            <span class="theme-toggle-text">Dark Mode</span>
        </button>
    </div>

    <main class="auth-container">

        <section class="auth-info">

            <a href="login.html" class="brand">
                <span class="brand-icon">🌍</span>
                <span>World Currency Exchange</span>
            </a>

            <div class="auth-info-content">

                <span class="eyebrow">
                    ACCOUNT RECOVERY
                </span>

                <h1>
                    Reset your
                    <span>password.</span>
                </h1>

                <p>
                    Enter your registered email and create
                    a new password.
                </p>

            </div>

        </section>


        <section class="auth-card">

            <div class="auth-title">

                <div class="auth-icon">
                    <i class="fa-solid fa-key"></i>
                </div>

                <h2>Forgot Password?</h2>

                <p>
                    Reset your account password.
                </p>

            </div>


            <form id="forgotForm">

                <label>Registered Email</label>

                <div class="input-box">

                    <i class="fa-regular fa-envelope"></i>

                    <input
                        type="email"
                        id="forgotEmail"
                        placeholder="Enter registered email"
                        required
                    >

                </div>


                <label>New Password</label>

                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        id="newPassword"
                        placeholder="New password"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        data-target="newPassword"
                    >
                        <i class="fa-regular fa-eye"></i>
                    </button>

                </div>


                <label>Confirm Password</label>

                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        id="confirmNewPassword"
                        placeholder="Confirm password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="primary-button full"
                >
                    UPDATE PASSWORD
                    <i class="fa-solid fa-check"></i>
                </button>


                <p
                    id="forgotMessage"
                    class="form-message"
                ></p>

            </form>


            <a
                href="login.html"
                class="secondary-button full center"
            >
                Back to Login
            </a>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
